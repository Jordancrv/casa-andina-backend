name: Compilar y desplegar backend Casa Andina

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: casa-andina-api
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  API_PROJECT: src/CasaAndina.Api/CasaAndina.Api.csproj
  TEST_PROJECT: tests/CasaAndina.Application.Tests/CasaAndina.Application.Tests.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Ejecutar pruebas
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration "${{ env.CONFIGURATION }}" --verbosity minimal

      - name: Publicar API
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration "${{ env.CONFIGURATION }}" --output "${{ runner.temp }}/publish"

      - name: Guardar archivos publicados
        uses: actions/upload-artifact@v4
        with:
          name: backend-publicado
          path: ${{ runner.temp }}/publish
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    environment: casa_andina_api_Env

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar archivos publicados
        uses: actions/download-artifact@v4
        with:
          name: backend-publicado
          path: ${{ runner.temp }}/publish

      - name: Verificar configuración de Azure
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.casa_andina_api_TENANT_ID_466D }}
          SUBSCRIPTION_ID: ${{ vars.casa_andina_api_SUBSCRIPTION_ID_466D }}
        run: |
          foreach ($name in @("CLIENT_ID", "TENANT_ID", "SUBSCRIPTION_ID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Falta configurar la variable $name en GitHub."
            }
          }
          Write-Host "Las tres variables de Azure están configuradas."

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.casa_andina_api_TENANT_ID_466D }}
          subscription-id: ${{ vars.casa_andina_api_SUBSCRIPTION_ID_466D }}

      - name: Desplegar backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ${{ runner.temp }}/publish
